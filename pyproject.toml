[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-brime"
version = "0.2.2"
description = "LangChain integration for the Brime API (search · extract · research) — tools and retriever"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brime", email = "support@brime.dev" }]
keywords = ["brime", "langchain", "search", "extract", "research", "rag", "agents", "tools", "retriever"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=0.3,<2.0",
    "brime>=0.2.0",
]

# Legacy pip-friendly extras
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "twine>=5.1",
    "build>=1.2",
]
test = [
    "langchain-tests>=0.3,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ruff>=0.7",
    "twine>=5.1",
    "build>=1.2",
    "langchain-tests>=0.3,<2.0",
]

[project.urls]
Homepage = "https://brime.dev"
Documentation = "https://docs.brime.dev/sdks/langchain"
Repository = "https://github.com/brime-dev/brime-langchain"
Issues = "https://github.com/brime-dev/brime-langchain/issues"
Changelog = "https://github.com/brime-dev/brime-langchain/blob/main/CHANGELOG.md"

# ─── Build ──────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_brime"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_brime", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# ─── uv ─────────────────────────────────────────────────────────────────────

[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# ─── Lint + format ──────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "N", "RUF", "SIM", "TID",
]
ignore = [
    "E501",
    "N818",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N"]

# ─── Type checking ──────────────────────────────────────────────────────────

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/langchain_brime"]
follow_imports = "silent"
warn_unused_ignores = true

[tool.pyright]
include = ["src/langchain_brime"]
exclude = ["**/__pycache__", "**/node_modules", "dist", "build", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingImports = true
reportUnusedImport = "warning"

# ─── Tests ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires BRIME_API_KEY + (OPENAI_API_KEY or ANTHROPIC_API_KEY)",
]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = ["-ra", "--strict-markers", "-p", "no:benchmark"]
