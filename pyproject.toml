[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-brime"
version = "0.1.0"
description = "LangChain integration for the Brime API (search · extract · research) — tools and retriever"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Brime", email = "support@brime.dev" }]
keywords = ["brime", "langchain", "search", "extract", "research", "rag", "agents", "tools", "retriever"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=0.3,<2.0",
    "brime>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.6",
]
test-integration = [
    "langchain-tests>=0.3",
]

[project.urls]
Homepage = "https://brime.dev"
Documentation = "https://docs.brime.dev/integrations/langchain"
Repository = "https://github.com/brime-dev/brime-langchain"
Issues = "https://github.com/brime-dev/brime-langchain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_brime"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_brime", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires BRIME_API_KEY + (OPENAI_API_KEY or ANTHROPIC_API_KEY)",
]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/langchain_brime"]
follow_imports = "silent"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]
